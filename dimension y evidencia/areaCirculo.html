<font face="Arial">
    <h2>Funciones que devuelven resultados</h2>

    <script type="text/javascript">

        function calcularAreaCirulo(radio) {
            var area = Math.PI * radio * radio;
            var area2 =area.toFixed(2);
            return area2;
        }
        radio=prompt("Dame el valor del radio del círculo:", "Escribe un numero entero");
        var areaCirculo = calcularAreaCirulo(radio);
        document.write("El área del círculo es:" + areaCirculo);
    </script>
