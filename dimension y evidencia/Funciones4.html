<font face="Arial">
<h2>Funciones matematicas JavaScrip</h2>

<script type="text/javascript">
    document.write("<h2>Uso de la función de Valor Absoluto</h2>");
    let a = Math.abs(7.25);
    let b = Math.abs(-7.25);
    let c = Math.abs(null);
    let d = Math.abs("Hello");
    let e = Math.abs(2-3);
    document.write(a+"<br>" + b + "<br>" + c + "<br>" + d + "<br>" + e + "<br>");

    document.write("<h2>Uso de la función de Valor Maximo de una lista</h2>");
    let x = Math.max(5,10);
    document.write("El maximo es: "+ x + "<br>");

    let y = Math.max(0, 150, 30, 20, 38);
    document.write("El maximo es: "+ y + "<br>");

    let z = Math.max(-5, 4);
    document.write("El maximo es: "+ z + "<br>");

    document.write("<h2>Uso de la funcion que devuleve un valor al azar en un rango de 0 a 99</h2>");
    let numero = Math.floor(Math.random() * 100);
    document.write("El numero al azar es: "+ numero + "<br><br>");

    document.write("<h2>Uso de la funcion genera una Potencia</h2>");
    let potencia = Math.pow(2,3);
    document.write("El numero elevado a la potencia indicada es: " + potencia);
</script>
