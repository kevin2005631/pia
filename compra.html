<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TechMobile</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="main-header">
    <a id="logo-header" href="index.html">
        <span class="site-name">PIA</span>
        <span class="site-desc">Diseño Avanzado de Paginas Web</span>
    </a>
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="somos.html">¿Quienes somos?</a></li>
            <li><a href="catalogo.html">Catalogo</a></li>
        </ul>
    </nav>
    </header>
    <section id="main-content">
        <article>
            <header>
                <h1>Ingresa los datos:</h1>
            </header>
            <div class="content">
                <form action="procesar_compra.html" method="post">
                    <label for="nombre">Nombre Completo:</label><br>
                    <input type="text" id="nombre" name="nombre" required><br><br>

                    <label for="direccion">Dirección de Envío:</label><br>
                    <input type="text" id="direccion" name="direccion" required><br><br>

                    <label for="telefono">Número de Teléfono:</label><br>
                    <input type="tel" id="telefono" name="telefono" required><br><br>

                    <label for="email">Correo Electrónico:</label><br>
                    <input type="email" id="email" name="email" required><br><br>

                    <input type="submit" value="Comprar">
                </form>
            </div>
        </article>
    </section>
    <div id="popup" class="popup">
    <div class="popup-content">
    <h2>Datos guardados correctamente</h2>
    <button id="cerrarPopup">Cerrar</button>
    </div>
    </div>

    <script src="VentanaCompra.js"></script>

</body>
</html>
